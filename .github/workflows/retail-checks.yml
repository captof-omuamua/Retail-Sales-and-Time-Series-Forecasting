name: Retail checks

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.ipynb"
      - "requirements-retail.txt"
      - ".github/workflows/retail-checks.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.ipynb"
      - "requirements-retail.txt"
      - ".github/workflows/retail-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retail-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-and-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-retail.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-retail.txt
      - name: Run regression tests
        run: python -m pytest -q
      - name: Execute notebook with synthetic inputs
        run: python scripts/smoke_test.py --work-dir outputs/ci-synthetic-smoke

